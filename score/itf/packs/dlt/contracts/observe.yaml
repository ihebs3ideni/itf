# Observation contracts: what a session records on the side while the test runs.
contracts:
  - contract: observe.logs
    kind: capability
    role: logs
    version: 1
    summary: Log messages the session receives from the target (DLT), searchable by the test.
    description: >
      The session subscribes to the target's log stream and keeps a bounded buffer of decoded messages.
      Tests read them after the target did something. Factories may add `filter` (by application and context
      id), which is not required: gate on it with `shape=`. The subscription is made by the state
      `logs.active`.
    members:
      - name: is_active
        signature: "() -> bool"
        semantics: True while the stream delivers messages; the probe of the state `logs.active`.
      - name: lines
        signature: "() -> list[DltMessage]"
        semantics: Every buffered message in arrival order; raises RuntimeError when the stream is dead.
      - name: filter
        required: false
        signature: "(apid: str | None = None, ctid: str | None = None) -> list[DltMessage]"
        semantics: The buffered messages of one application id and context id, in arrival order.
    guarantees:
      - A message sent on the target arrives in lines() within seconds.
      - Where filter is offered, ids that no message has give an empty list.
    see_also:
      - logs.active
      - descriptor.endpoint
    conformance: score.itf.packs.dlt.conformance_observe

  - contract: observe.capture
    kind: capability
    role: capture
    version: 1
    summary: A packet capture the test can start, stop and read.
    description: >
      A capture of network traffic written to a file. It is started by the state
      `capture.running` (so it is on before the traffic of interest) and stopped at teardown.
      Factories may add `path` (the capture file) and `window` (capture one block of a test into its own
      file); neither is required: gate on them with `shape=`.
    members:
      - name: start
        signature: "() -> None"
        semantics: Starts capturing; normally done by the state, not by tests.
      - name: stop
        signature: "() -> None"
        semantics: Stops capturing and finalises the file; idempotent.
      - name: running
        signature: "() -> bool"
        semantics: True while the capture process is alive.
      - name: path
        required: false
        signature: "Path (a property)"
        semantics: The capture file.
      - name: window
        required: false
        signature: "(name: str, ready_timeout: float = 5.0) -> ContextManager[Path]"
        semantics: Captures one block of a test into its own file, named after `name`, and yields its path.
    guarantees:
      - running() is true while a capture is on.
    see_also:
      - capture.running
    conformance: score.itf.packs.dlt.conformance_observe

  - contract: logs.active
    kind: state
    version: 1
    summary: The session is subscribed to the target's log stream.
    description: >
      Delivered by the action that connects the observe.logs node; requires the platform to be up (the
      daemon lives there). Reaching it again after a restart resubscribes.
    probe: The stream's reader is alive.
    see_also:
      - observe.logs
      - platform.up

  - contract: capture.running
    kind: state
    version: 1
    summary: A packet capture is running.
    description: >
      Delivered by the capture action of a pack (on the host or on a platform interface). Anything that
      sends the traffic under test should require it so the first packets are not lost.
    probe: The capture process is alive.
    see_also:
      - observe.capture
      - platform.up

  - contract: logs.on_target
    kind: capability
    role: dlt_on_target
    version: 1
    summary: dlt-receive run on the target itself, started and stopped by the test.
    description: >
      Receives DLT where the target's own network sees it (multicast inside the target, a target-local TCP
      daemon). The provider puts the receiver binary on the target on the first start, through the target's
      files and process roles; each start runs one receiver that records to a file on the target.
    members:
      - name: start
        signature: "(transport, host_ip='127.0.0.1', target_ip='127.0.0.1', multicast_ips=None, print_to_stdout=True, output_file=None) -> ContextManager[DltReceiver]"
        semantics: Runs one receiver over transport ("tcp", "udp" or Protocol) and stops it when the block ends; the receiver has the process API plus dlt_file, the target path it records to.
      - name: close
        signature: "() -> None"
        semantics: Stops every receiver still running; called when the role is torn down.
    guarantees:
      - Constructing the role touches nothing on the target.
      - No receiver started through the role outlives it.
    see_also:
      - observe.logs
      - files.transfer
      - exec.process
