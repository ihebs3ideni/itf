# The original docker_plugin as a target file: one container from --docker-image. The platform is not a
# goal: the docker plugin's target_init starts it per test (or once, with --keep-target), after applying the
# docker_configuration fixture, as the original plugin did. The endpoint and credentials serve
# target.ssh() and sftp() on images running sshd (port 2222, score/score, as the plugin did); roles are built
# only when used. Port 2222 is published and the endpoint takes the published port, which works with Docker
# and with rootless Podman (no container IPs).
packs:
  docker: score.itf.packs.docker.plugin
  net: score.itf.packs.net.plugin
  ssh: score.itf.packs.ssh.plugin
capabilities:
  platform:
    factory: docker.platform
    with:
      image: ${LEGACY_DOCKER_IMAGE}
      bootstrap: ${LEGACY_DOCKER_BOOTSTRAP:-}
      extract_coverage: ${LEGACY_EXTRACT_COVERAGE:-false}
      coverage_dir: ${LEGACY_COVERAGE_DIR:-}
      ports: 2222/tcp
  command: docker.exec
  process: docker.process
  files: docker.files
  endpoint:
    factory: docker.endpoint
    with:
      port: 2222
  credentials:
    factory: net.password
    with:
      user: ${LEGACY_SSH_USER}
      password: ${LEGACY_SSH_PASSWORD}
  shell: ssh.shell
  sftp: ssh.files
relations:
  # The session connects to a service of the container: the container runs first.
  - state: shell.open
    after:
      - platform.up
