# An override file: the facts of one bench, merged by role over target.itf.yaml.
capabilities:
  shell:
    with:
      # CHANGE: a slow bench boots slowly: give it more attempts.
      n_retries: 60
  credentials:
    with:
      # CHANGE: this bench's login.
      user: score
      password: score
