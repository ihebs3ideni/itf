# A container running dlt-daemon, with the session receiving its DLT logs over TCP. The patched DLT
# build listens on port 13490; the daemon itself is started by the conftest's bench action, which
# the relation below orders before the logs subscription.
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: docker.instance
      config:
        image: score_itf_dlt:latest
        bootstrap: ${ITF_DLT_IMAGE_LOAD}
        ports: 13490/tcp
    - name: command
      contract: itf.capabilities.exec.command
      using: docker.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: docker.process
    - name: endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: docker.endpoint
      config:
        port: 13490
    - name: logs
      contract: itf.capabilities.observe.logs
      using: dlt.stream
init:
  goals:
    - itf.states.logs.active
  relations:
    - state: itf.states.logs.active
      requires:
        - example.dlt_daemon.running
