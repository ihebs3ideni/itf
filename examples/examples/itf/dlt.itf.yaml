# A target that sends DLT logs, received by the session (`logs`).
capabilities:
  platform:
    factory: docker.platform
    with:
      image: score_itf_dlt:latest
      bootstrap: ${ITF_IMAGE_LOAD}
      ports: 13490/tcp
  command: docker.exec
  process: docker.process
  endpoint:
    factory: docker.endpoint
    with:
      port: 13490
  logs:
    factory: dlt.stream
    with:
      ecu_id: ECU1
goals:
  # The dlt pack has an action per way of receiving; the project's own waits for the daemon it starts
  # (conftest.py), so the subscription never runs before something sends.
  - state: logs.active
    by: project.activate_logs
