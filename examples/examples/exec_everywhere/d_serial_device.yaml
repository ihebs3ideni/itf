# A serial device inside a container: a fake ECU (fake_ecu.py) on a stock Python image listens on a TCP
# port, and the real serial console provider reaches it with pyserial's socket:// URL. The console must
# not open before the device listens, so the conftest's action orders that.
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: docker.instance
      config:
        image: python:3.12-slim
        command: python3 /ecu/fake_ecu.py
        init: false
        ports: "2323/tcp:${FAKE_ECU_PORT:-23230}"
        volumes: "${FAKE_ECU_SCRIPT}:/ecu/fake_ecu.py:ro"
    - name: endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: docker.endpoint
      config:
        port: 2323
        via: published
    - name: console
      contract: itf.capabilities.exec.console
      using: serial.console
      config:
        device: "socket://127.0.0.1:${FAKE_ECU_PORT:-23230}"
    - name: command
      contract: itf.capabilities.exec.command
      using: serial.exec
init:
  goals:
    - itf.states.console.open
  relations:
    - state: itf.states.console.open
      requires:
        - example.fake_ecu.listening
