# The original docker_plugin as a recipe: one container from --docker-image. The platform is not a
# goal: the `target` fixture starts it once docker_configuration (a fixture) is known. The SSH nodes
# serve target.ssh()/sftp() on images running sshd (port 2222, score/score, as the plugin did);
# nodes are built only when used. Port 2222 is published and the endpoint takes the published port, which
# works with Docker and with rootless Podman (no container IPs).
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: docker.instance
      config:
        image: ${LEGACY_DOCKER_IMAGE}
        bootstrap: "${LEGACY_DOCKER_BOOTSTRAP:-}"
        extract_coverage: ${LEGACY_EXTRACT_COVERAGE:-false}
        coverage_dir: "${LEGACY_COVERAGE_DIR:-}"
        ports: 2222/tcp
    - name: command
      contract: itf.capabilities.exec.command
      using: docker.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: docker.process
    - name: files
      contract: itf.capabilities.files.transfer
      using: docker.files
    - name: endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: docker.endpoint
      config:
        port: 2222
    - name: creds
      contract: itf.capabilities.descriptor.credentials
      using: password.credentials
      config:
        user: score
        password: score
    - name: shell
      contract: itf.capabilities.exec.shell
      using: ssh.shell
    - name: sftp
      contract: itf.capabilities.files.transfer
      using: sftp.files
