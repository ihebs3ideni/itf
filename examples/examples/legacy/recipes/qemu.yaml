# The original qemu_plugin as a recipe: the machine from --qemu-config/--qemu-kernel/--qemu-rootfs/
# --qemu-disk, reached over SSH. Bring-up reaches what the old pre-test checks did: ping, SSH.
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: qemu.instance
      config:
        config_file: ${LEGACY_QEMU_CONFIG}
        kernel: "${LEGACY_QEMU_KERNEL:-}"
        rootfs: "${LEGACY_QEMU_ROOTFS:-}"
        disk: "${LEGACY_QEMU_DISK:-}"
    - name: endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: qemu.endpoint
    - name: credentials
      contract: itf.capabilities.descriptor.credentials
      using: qemu.credentials
    - name: shell
      contract: itf.capabilities.exec.shell
      using: ssh.shell
    - name: command
      contract: itf.capabilities.exec.command
      using: ssh.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: ssh.process
    - name: files
      contract: itf.capabilities.files.transfer
      using: sftp.files
    - name: ping
      contract: itf.capabilities.net.ping
      using: icmp.ping
init:
  goals:
    - itf.states.platform.up
    - itf.states.network.reachable
    - itf.states.shell.open
