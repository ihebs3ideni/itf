# A serial console on a shell over a pseudo-terminal: a UART with something answering, so commands go
# through the console (serial.exec) with no hardware and no container. Runs anywhere with a shell.
setup:
  nodes:
    - name: console
      contract: itf.capabilities.exec.console
      using: serial.pty_console
    - name: command
      contract: itf.capabilities.exec.command
      using: serial.exec
init:
  goals:
    - itf.states.console.open
