# A container running dlt-daemon. Each variant adds the logs node that receives from it.
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: docker.instance
      config:
        image: score_itf_examples:latest
        bootstrap: ${ITF_IMAGE_LOAD}
        ports: "13490/tcp:${ITF_DLT_PORT:-13490}"   # the patched DLT build listens on 13490
    - name: command
      contract: itf.capabilities.exec.command
      using: docker.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: docker.process
    - name: files
      contract: itf.capabilities.files.transfer
      using: docker.files
    - name: dlt_endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: docker.endpoint
      config:
        port: 13490

init:
  goals:
    - itf.states.logs.active
  relations:
    - state: itf.states.logs.active
      requires:
        - bench.dlt_daemon.running
