# The test host itself: commands, processes and files through subprocess. Runs anywhere.
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: local.instance
    - name: command
      contract: itf.capabilities.exec.command
      using: local.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: local.process
    - name: files
      contract: itf.capabilities.files.transfer
      using: local.files
init:
  goals:
    - itf.states.platform.up
