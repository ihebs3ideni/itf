# A container running sshd: commands and files through SSH/SFTP, a shell session, the Docker API
# for the platform. Ports are published, so rootless Podman works too.
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: docker.instance
      config:
        image: linuxserver/openssh-server:version-10.2_p1-r0
        command: null
        init: false
        environment: PASSWORD_ACCESS=true,USER_NAME=score,USER_PASSWORD=score
        ports: 2222/tcp
        volumes: "${ITF_EXTRA_MOUNT}:/extra/mount:ro"
    - name: endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: docker.endpoint
      config:
        port: 2222
    - name: creds
      contract: itf.capabilities.descriptor.credentials
      using: password.credentials
      config:
        user: score
        password: score
    - name: shell
      contract: itf.capabilities.exec.shell
      using: ssh.shell
      config:
        n_retries: 20
    - name: command
      contract: itf.capabilities.exec.command
      using: ssh.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: ssh.process
    - name: files
      contract: itf.capabilities.files.transfer
      using: sftp.files
init:
  goals:
    - itf.states.platform.up
    - itf.states.network.reachable
    - itf.states.shell.open
