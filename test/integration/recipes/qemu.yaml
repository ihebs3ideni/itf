# A QEMU machine reached over SSH. Paths come from the BUILD target's env; the endpoint and login
# come from the machine's own JSON configuration (qemu.endpoint, qemu.credentials).
setup:
  nodes:
    - name: platform
      contract: itf.capabilities.platform.instance
      using: qemu.instance
      config:
        config_file: ${ITF_QEMU_CONFIG}
        kernel: ${ITF_QEMU_KERNEL:-}
        rootfs: ${ITF_QEMU_ROOTFS:-}
        disk: ${ITF_QEMU_DISK:-}
    - name: console
      contract: itf.capabilities.exec.console
      using: qemu.console
    - name: endpoint
      contract: itf.capabilities.descriptor.endpoint
      using: qemu.endpoint
    - name: credentials
      contract: itf.capabilities.descriptor.credentials
      using: qemu.credentials
    - name: ping
      contract: itf.capabilities.net.ping
      using: icmp.ping
      config:
        boot_timeout: 120
    - name: shell
      contract: itf.capabilities.exec.shell
      using: ssh.shell
      config:
        n_retries: 60
        retry_interval: 2.0
    - name: command
      contract: itf.capabilities.exec.command
      using: ssh.exec
    - name: process
      contract: itf.capabilities.exec.process
      using: ssh.process
    - name: files
      contract: itf.capabilities.files.transfer
      using: sftp.files

init:
  # The console records from before boot: open it first.
  goals:
    - itf.states.console.open
    - itf.states.platform.up
    - itf.states.network.reachable
    - itf.states.shell.open
  relations:
    - state: itf.states.platform.up
      requires:
        - itf.states.console.open
