capabilities:
  platform:
    factory: docker.platform
    with:
      image: linuxserver/openssh-server:version-10.2_p1-r0
      command: null
      init: false
      environment: PASSWORD_ACCESS=true,USER_NAME=score,USER_PASSWORD=score
      ports: 2222/tcp
      volumes: ${ITF_EXTRA_MOUNT}:/extra/mount:ro
  endpoint:
    factory: docker.endpoint
    with:
      port: 2222
  credentials:
    factory: net.password
    with:
      user: score
      password: score
  shell:
    factory: ssh.shell
    with:
      n_retries: 20
  command: ssh.exec
  process: ssh.process
  files: ssh.files
goals:
  - platform.up
  - network.reachable
  - shell.open
