policies:
  - test/integration/targets/observability/policy.py
  - test/integration/targets/observability/qnx_policy.py
packs:
  qemu: score.itf.packs.qemu.plugin
  ssh: score.itf.packs.ssh.plugin
  pcap: score.itf.packs.pcap.plugin
  dlt: score.itf.packs.dlt.plugin
capabilities:
  platform:
    factory: qemu.platform
    with:
      config_file: ${ITF_QEMU_CONFIG}
      kernel: ${ITF_QEMU_KERNEL}
  console: qemu.console
  endpoint: qemu.endpoint
  credentials: qemu.credentials
  shell:
    factory: ssh.shell
    with:
      n_retries: 60
      retry_interval: 2.0
  command: ssh.exec
  process: ssh.process
  files: ssh.files
  capture:
    factory: pcap.capture
    with:
      interface: tap0
      filter: udp
      binary_path: ${ITF_TCPDUMP:-tcpdump}
  logs:
    factory: dlt.multicast
    with:
      sources: 169.254.21.88=239.255.42.99
      port: 3490
      dlt_file: ${TEST_UNDECLARED_OUTPUTS_DIR:-itf-run}/multicast.dlt
  traffic:
    factory: local.traffic
    bind:
      command: command
    with:
      host: 169.254.21.88
      port: 3491
      group: 239.255.42.99
      multicast_port: 3490
  packet_reader:
    factory: local.packet_reader
    with:
      binary_path: ${ITF_TCPDUMP:-tcpdump}
goals:
  - state: platform.up
    by: qemu.start
  - state: console.open
    by: qemu.open_console
  - state: shell.open
    by: ssh.open
  - state: capture.running
    by: pcap.start_on_host
  - state: logs.active
    by: dlt.join
  - traffic.ready
relations:
  - state: platform.up
    after:
      - capture.running
      - logs.active
  - state: console.open
    after:
      - platform.up
  - state: shell.open
    after:
      - console.open
  - state: traffic.ready
    after:
      - shell.open