<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITF Pack Catalog</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --ink: #1d2433; --muted: #5d6779; --line: #e1e5ec;
    --cap: #2563eb; --cap-soft: #e8efff; --state: #0f8a5f; --state-soft: #e3f6ee;

  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; }
  a { color: inherit; }
  code, pre, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.86em; }
  header { position: sticky; top: 0; z-index: 5; background: #111827; color: #fff; padding: 14px 28px 0; }
  .brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0.2px; }
  .brand h1 span { color: #93c5fd; }
  .stats { color: #a5b0c2; font-size: 13px; }
  .search { margin-left: auto; position: relative; flex: 0 1 420px; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 9px; border: 1px solid #374151;
    background: #1f2937; color: #fff; font-size: 14px; }
  .search input::placeholder { color: #8b95a7; }
  .search::before { content: "\2315"; position: absolute; left: 11px; top: 6px; color: #8b95a7; font-size: 18px; }
  nav { display: flex; gap: 4px; margin-top: 12px; }
  nav a { text-decoration: none; color: #c4cbd8; padding: 9px 14px; border-radius: 8px 8px 0 0; font-size: 14px; }
  nav a.active { background: var(--bg); color: var(--ink); font-weight: 600; }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 28px 60px; }
  .lead { color: var(--muted); margin: 0 0 14px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px;
    cursor: pointer; font-size: 13px; color: var(--muted); }
  .filter.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
    text-decoration: none; display: flex; flex-direction: column; gap: 8px; transition: box-shadow .15s, transform .15s; }
  .card:hover { box-shadow: 0 6px 20px rgba(17, 24, 39, .08); transform: translateY(-1px); }
  .card h3 { margin: 0; font-size: 16px; }
  .card .sub { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .card .foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; flex: none; }

  .k-cap .icon { background: var(--cap-soft); color: var(--cap); }
  .k-state .icon { background: var(--state-soft); color: var(--state); }
  .k-prov .icon { background: var(--prov-soft); color: var(--prov); }
  .k-pack .icon { background: var(--pack-soft); color: var(--pack); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px;
    background: var(--code); color: var(--ink); text-decoration: none; border: 1px solid transparent; white-space: nowrap; }
  a.chip:hover { border-color: currentColor; }
  .chip.cap { background: var(--cap-soft); color: var(--cap); }
  .chip.state { background: var(--state-soft); color: var(--state); }
  .chip.prov { background: var(--prov-soft); color: var(--prov); }
  .chip.pack { background: var(--pack-soft); color: var(--pack); }
  .chip.variant { background: #eef0f4; color: #374151; }
  .chip.warn { background: #fff4d6; color: #8a5a00; }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .crumbs a { color: var(--muted); }
  .hero { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
  .hero .head .icon { width: 46px; height: 46px; font-size: 20px; }
  .hero h2 { margin: 0; font-size: 22px; }
  .hero .sub { color: var(--muted); font-size: 13.5px; word-break: break-all; }
  .hero p { color: var(--ink); margin: 12px 0 0; white-space: pre-line; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  section { margin-bottom: 22px; }
  section > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .panel h4 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel p { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; white-space: pre-line; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0; font-size: 13.5px; }
  .row b { min-width: 92px; color: var(--muted); font-weight: 500; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; background: #fafbfc; }
  td.yes { color: var(--state); font-weight: 700; } td.no { color: #c0c6d0; }
  pre { background: var(--code); border-radius: 9px; padding: 10px 12px; overflow: auto; margin: 8px 0; }
  .snippet { position: relative; }
  .copy { position: absolute; right: 8px; top: 8px; border: 1px solid var(--line); background: #fff; border-radius: 6px;
    font-size: 12px; padding: 2px 8px; cursor: pointer; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .search { flex-basis: 100%; } }
  .readme { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 22px 14px; }
  .readme h3, .readme h4, .readme h5 { margin: 18px 0 6px; }
  .readme p, .readme li { font-size: 14px; }
  .readme :not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .empty { color: var(--muted); font-style: italic; font-size: 13.5px; }
  .banner { background: #fff4d6; border: 1px solid #f3d27a; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13.5px; }
  mark { background: #fff1a8; border-radius: 3px; }
</style>
</head>

  </div>
  <nav id="tabs"></nav>
</header>

dumps` or `--//score/itf/packs/core_dump:core_dumps_output_dir`.\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'core.%'\"`.\n", "requirements": []}, {"doc": "DLT logs: a stdlib TCP stream or UDP multicast receiver, the dlt-receive tool with python-dlt\nqueries, and dlt-receive run on the target itself.", "entrypoints": ["score.itf.packs.dlt.multicast.plugin", "score.itf.packs.dlt.plugin", "score.itf.packs.dlt.receive.plugin", "score.itf.packs.dlt.sim.plugin"], "name": "dlt", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# DLT pack\n\nDLT logs from the target: a stdlib TCP stream or UDP multicast receiver, the bundled `dlt-receive` with python-dlt queries, and `dlt-receive` run on the target.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/dlt` | TCP stream, stdlib framing |\n| `//score/itf/packs/dlt:multicast` | UDP multicast, stdlib framing |\n| `//score/itf/packs/dlt:receive` | the Bazel-built dlt-receive, recorded to a file |\n| `//score/itf/packs/dlt:on_target` | the `dlt_on_target` fixture |\n| `//score/itf/packs/dlt:sim` | in-memory logs |\n\n**Providers**\n\n- `dlt.stream`, `dlt.multicast`, `dlt.receive`, `dlt.receive_tcp` (observe.logs): `lines()`, `filter(apid, ctid)`; dlt-receive variants add `record()` (python-dlt `find(query)`) and per-test `window()`\n\n**Actions**\n\n- `dlt.subscribe_stream`, `dlt.join_multicast`, `dlt.start_receive` \u2192 `itf.states.logs.active` (load one variant)\n\n**Host prerequisites:** None: dlt-receive and libdlt are built from source. The patched DLT build listens on TCP 13490.\n\n**Recipe excerpt**\n\n```yaml\n    - name: logs\n      contract: itf.capabilities.observe.logs\n      using: dlt.stream\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'dlt.%'\"`.\n", "requirements": []}, {"doc": "Docker: a container as the target platform, with native exec, processes and file transfer.", "entrypoints": ["score.itf.packs.docker.plugin", "score.itf.packs.docker.sim.plugin"], "name": "docker", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# Docker pack\n\nA container as the target platform, reached through the Docker API (works with any image) and, with the ssh pack, over SSH.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/docker` | `score.itf.packs.docker.plugin` |\n| `//score/itf/packs/docker:sim` | in-memory platform for offline runs |\n\n**Providers**\n\n- `docker.instance` (platform.instance): image, command, environment, ports, volumes, its own bridge network, image `bootstrap`, coverage extraction; `ip()`, `gateway()`, `host_port()`, `restart()`\n- `docker.exec` (exec.command), `docker.process` (exec.process), `docker.files` (files.transfer)\n- `docker.endpoint` (descriptor.endpoint): a service in the container, by IP or published port (`via`)\n\n**Actions**\n\n- `docker.start_platform` \u2192 `itf.states.platform.up`\n\n**Config string formats:** `environment` is `KEY=value,KEY2=value2`; `ports` is `22/tcp:2222,3490/tcp` (container port, optional host port, otherwise one is chosen) or just `2222`; `volumes` is `/host:/in/container:rw,...`. `docker.endpoint` `via` is `auto` (published port when published, else the container IP), `ip` or `published`.\n\n**Host prerequisites:** A Docker-compatible daemon (`DOCKER_HOST` for Podman). Under rootless Podman, publish ports and use `docker.endpoint` with `via: published`.\n\n**Recipe excerpt**\n\n```yaml\nsetup:\n  nodes:\n    - name: platform\n      contract: itf.capabilities.platform.instance\n      using: docker.instance\n      config:\n        image: ubuntu:24.04\n    - name: command\n      contract: itf.capabilities.exec.command\n      using: docker.exec\ninit:\n  goals:\n    - itf.states.platform.up\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'docker.%'\"`.\n", "requirements": []}, {"doc": "The test host itself as the platform: commands, processes and files through subprocess.", "entrypoints": ["score.itf.packs.local.plugin"], "name": "local", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# Local host pack\n\nThe test host itself as the platform: commands, processes and files through subprocess. Runs anywhere; useful for host-side binaries and for capability suites without a daemon.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/local` | `score.itf.packs.local.plugin` |\n\n**Providers**\n\n- `local.instance` (platform.instance): a working directory (`root`, default temporary)\n- `local.exec` (exec.command), `local.process` (exec.process), `local.files` (files.transfer)\n\n**Actions**\n\n- `local.start_platform` \u2192 `itf.states.platform.up`\n\n**Host prerequisites:** None.\n\n**Recipe excerpt**\n\n```yaml\n    - name: platform\n      contract: itf.capabilities.platform.instance\n      using: local.instance\n    - name: command\n      contract: itf.capabilities.exec.command\n      using: local.exec\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'local.%'\"`.\n", "requirements": []}, {"doc": "Endpoints and credentials other capabilities bind to.", "entrypoints": ["score.itf.packs.net.plugin"], "name": "net", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# Network descriptors pack\n\nStatic endpoints and credentials other capabilities bind to.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/net` | `score.itf.packs.net.plugin` |\n\n**Providers**\n\n- `static.endpoint` (descriptor.endpoint): `host`, `port`\n- `key.credentials`, `password.credentials` (descriptor.credentials): `user` with `key_path` or `password` (sensitive: redacted from artifacts)\n\n**Actions**\n\n- \u2014\n\n**Host prerequisites:** None.\n\n**Recipe excerpt**\n\n```yaml\n    - name: endpoint\n      contract: itf.capabilities.descriptor.endpoint\n      using: static.endpoint\n      config:\n        host: 192.0.2.10\n        port: 22\n    - name: creds\n      contract: itf.capabilities.descriptor.credentials\n      using: key.credentials\n      config:\n        user: root\n        key_path: keys/id_ed25519\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'net.%'\"`.\n", "requirements": []}, {"doc": "Packet capture with tcpdump, built from source and shipped beside the pack.", "entrypoints": ["score.itf.packs.pcap.host", "score.itf.packs.pcap.plugin", "score.itf.packs.pcap.sim.plugin"], "name": "pcap", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# Packet capture pack\n\ntcpdump captures, built from source with libpcap and shipped with the pack.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/pcap` | capture started after `platform.up` |\n| `//score/itf/packs/pcap:host` | capture on a host interface, started first |\n| `//score/itf/packs/pcap:sim` | in-memory capture |\n\n**Providers**\n\n- `tcpdump.capture` (observe.capture): `interface`, `filter`, `out_dir`; `path()`, `running()`, per-test `window(name)`\n\n**Actions**\n\n- `tcpdump.start_capture` / `tcpdump.start_host_capture` \u2192 `itf.states.capture.running`\n\n**Host prerequisites:** `CAP_NET_RAW` (or root) and the interface on the host.\n\n**Recipe excerpt**\n\n```yaml\n    - name: capture\n      contract: itf.capabilities.observe.capture\n      using: tcpdump.capture\n      config:\n        interface: docker0\n        filter: tcp port 22\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'pcap.%'\"`.\n", "requirements": []}, {"doc": "ICMP reachability: answering ping, and waiting for a target to boot or go down.", "entrypoints": ["score.itf.packs.ping.boot", "score.itf.packs.ping.plugin"], "name": "ping", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# Ping pack\n\nICMP reachability without a ping binary (unprivileged or raw ICMP sockets, the system `ping` as a last resort).\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/ping` | `score.itf.packs.ping.plugin` (provider only) |\n| `//score/itf/packs/ping:boot` | `score.itf.packs.ping.boot` (adds `icmp.await_boot`) |\n\n**Providers**\n\n- `icmp.ping` (net.ping): `ping()`, `wait_up(timeout)`, `wait_down(timeout)` for the bound endpoint's host\n\n**Actions**\n\n- `icmp.await_boot` \u2192 `itf.states.platform.up` (`:boot` only): for machines no pack starts, e.g. hardware\n\n**Host prerequisites:** `net.ipv4.ping_group_range` covering the user, or `CAP_NET_RAW`, or a `ping` binary.\n\n**Recipe excerpt**\n\n```yaml\n    - name: ping\n      contract: itf.capabilities.net.ping\n      using: icmp.ping\n      config:\n        boot_timeout: 180\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'ping.%'\"`.\n", "requirements": []}, {"doc": "QEMU: an emulated machine as the target platform, its serial console, and the endpoint and login\nits JSON configuration describes.", "entrypoints": ["score.itf.packs.qemu.plugin"], "name": "qemu", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# QEMU pack\n\nAn emulated machine as the target platform, configured by ITF's QEMU JSON (networks, SSH port, login, machine type).\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/qemu` | `score.itf.packs.qemu.plugin` |\n\n**Providers**\n\n- `qemu.instance` (platform.instance): `config_file`, `kernel`, `rootfs`, `disk`; images boot through temporary qcow2 overlays\n- `qemu.console` (exec.console): the serial port, recorded from `console.open`\n- `qemu.endpoint`, `qemu.credentials` (descriptors): the SSH endpoint and login the JSON names\n\n**Actions**\n\n- `qemu.start_platform` \u2192 `itf.states.platform.up`\n- `qemu.open_console` \u2192 `itf.states.console.open` (relate `platform.up` to it to record the boot)\n\n**Host prerequisites:** `qemu-system-*`, `qemu-img`, `/dev/kvm` for acceleration; tap networking runs under `//scripts:run_under_qemu`.\n\n**Recipe excerpt**\n\n```yaml\nsetup:\n  nodes:\n    - name: platform\n      contract: itf.capabilities.platform.instance\n      using: qemu.instance\n      config:\n        config_file: ${QEMU_CONFIG}\n        kernel: ${QEMU_KERNEL}\n    - name: endpoint\n      contract: itf.capabilities.descriptor.endpoint\n      using: qemu.endpoint\n    - name: credentials\n      contract: itf.capabilities.descriptor.credentials\n      using: qemu.credentials\n    - name: shell\n      contract: itf.capabilities.exec.shell\n      using: ssh.shell\ninit:\n  goals:\n    - itf.states.shell.open\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'qemu.%'\"`.\n", "requirements": []}, {"doc": "Serial consoles (UART) over pyserial, and commands run on them.", "entrypoints": ["score.itf.packs.serial.plugin"], "name": "serial", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# Serial console pack\n\nA line-oriented UART console over pyserial, recording every line from when it opens.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/serial` | `score.itf.packs.serial.plugin` |\n\n**Providers**\n\n- `serial.console` (exec.console): `device` (any pyserial URL, e.g. `loop://`), `baudrate`, `logfile`; `lines(since)`, `mark()`, `wait_for(pattern)`, `write()`, `run()`\n- `serial.pty_console` (exec.console): the same console on a shell over a pseudo-terminal (`shell`, `banner`), a UART with something answering, for benches without hardware\n- `serial.exec` (exec.command) over the console; the command's output, including a last line without newline, comes back with its exit code\n\n**Actions**\n\n- `serial.open_console` \u2192 `itf.states.console.open`\n\n**Host prerequisites:** The serial device.\n\n**Recipe excerpt**\n\n```yaml\n    - name: console\n      contract: itf.capabilities.exec.console\n      using: serial.console\n      config:\n        device: /dev/ttyUSB0\n        baudrate: 115200\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'serial.%'\"`.\n", "requirements": []}, {"doc": "SSH: a shell session, commands, asynchronous processes and SFTP file transfer over one connection.", "entrypoints": ["score.itf.packs.ssh.plugin", "score.itf.packs.ssh.sim.plugin"], "name": "ssh", "readme": "<!--\n*******************************************************************************\nCopyright (c) 2025 Contributors to the Eclipse Foundation\nSee the NOTICE file(s) distributed with this work for additional\ninformation regarding copyright ownership.\nThis program and the accompanying materials are made available under the\nterms of the Apache License Version 2.0 which is available at\nhttps://www.apache.org/licenses/LICENSE-2.0\nSPDX-License-Identifier: Apache-2.0\n*******************************************************************************\n-->\n\n# SSH pack\n\nA paramiko session to the target, and commands, processes and SFTP file transfer over it.\n\n| Bazel label | Loads |\n|---|---|\n| `//score/itf/packs/ssh` | `score.itf.packs.ssh.plugin` |\n| `//score/itf/packs/ssh:sim` | in-memory shell for offline runs |\n\n**Providers**\n\n- `ssh.shell` (exec.shell): password or key login, retries, keep-alive; `run`, `exec`, `exec_lines` (separate stderr, start and run timeouts), `client()`\n- `ssh.exec` (exec.command), `ssh.process` (exec.process), `sftp.files` (files.transfer, plus `exists`, `listdir`, `remove`, `upload_dir`, `download_dir`)\n\n**Actions**\n\n- `ssh.open_session` \u2192 `itf.states.shell.open` and `itf.states.network.reachable`, each with its own probe (connected; endpoint accepts TCP)\n\n**Host prerequisites:** None beyond paramiko (pip, locked).\n\n**Recipe excerpt**\n\n```yaml\n    - name: shell\n      contract: itf.capabilities.exec.shell\n      using: ssh.shell\n      config:\n        n_retries: 20\n    - name: command\n      contract: itf.capabilities.exec.command\n      using: ssh.exec\n```\n\nMembers, signatures and config keys: `bazel run //tools/catalog:query -- sql \"SELECT * FROM v_recipe_node WHERE provider LIKE 'ssh.%'\"`.\n", "requirements": []}], "providers": [{"api": [{"doc": "", "member": "active", "signature": "() -> bool"}, {"doc": "", "member": "bound_port", "signature": "() -> int"}, {"doc": "", "member": "close", "signature": "() -> None"}, {"doc": "", "member": "count", "signature": "() -> int"}, {"doc": "", "member": "dropped_bytes", "signature": "() -> int"}, {"doc": "", "member": "filter", "signature": "(apid: str | None = None, ctid: str | None = None, ecu_id: str | None = None) -> list[DltMessage]"}, {"doc": "", "member": "lines", "signature": "() -> list[DltMessage]"}, {"doc": "", "member": "path", "signature": "() -> Path | None"}, {"doc": "", "member": "subscribe", "signature": "() -> None"}], "config": [{"default": null, "name": "sources", "required": true, "sensitive": false, "type": "str"}, {"default": 3490, "name": "port", "required": false, "sensitive": false, "type": "int"}, {"default": null, "name": "dlt_file", "required": false, "sensitive": false, "type": "str | null"}, {"default": 100000, "name": "buffer", "required": false, "sensitive": false, "type": "int"}, {"default": 2.0, "name": "stop_timeout", "required": false, "sensitive": false, "type": "float"}], "contract": "itf.capabilities.observe.logs", "doc": "", "entrypoints": ["score.itf.packs.dlt.multicast.plugin"], "gives": ["active", "bound_port", "close", "count", "dropped_bytes", "filter", "lines", "path", "subscribe"], "module": "score.itf.packs.dlt.multicast.providers", "name": "dlt.multicast", "needs": [], "pack": "dlt", "variant": "multicast"}, {"api": [{"doc": "", "member": "close", "signature": "() -> None"}, {"doc": "", "member": "filter", "signature": "(apid: str | None = None, ctid: str | None = None) -> list[DltMessage]"}, {"doc": "", "member": "lines", "signature": "() -> list[DltMessage]"}, {"doc": "Connect, retrying until `connect_timeout`: the daemon may still be starting with the target.", "member": "subscribe", "signature": "() -> None"}], "config": [{"default": "", "name": "ecu_id", "required": false, "sensitive": false, "type": "str"}, {"default": 4096, "name": "buffer", "required": false, "sensitive": false, "type": "int"}, {"default": 60.0, "name": "connect_timeout", "required": false, "sensitive": false, "type": "float"}], "contract": "itf.capabilities.observe.logs", "doc": "", "entrypoints": ["score.itf.packs.dlt.plugin"], "gives": ["close", "filter", "lines", "subscribe"], "module": "score.itf.packs.dlt.providers", "name": "dlt.stream", "needs": [{"contract": "itf.capabilities.descriptor.endpoint", "members": ["host", "port"], "slot": "endpoint"}], "pack": "dlt", "variant": "shared"}, {"api": [{"doc": "", "member": "active", "signature": "() -> bool"}, {"doc": "", "member": "close", "signature": "() -> None"}, {"doc": "", "member": "filter", "signature": "(apid: str | None = None, ctid: str | None = None) -> list[Message]"}, {"doc": "", "member": "lines", "signature": "() -> list[Message]"}, {"doc": "", "member": "path", "signature": "() -> str"}, {"doc": "", "member": "record", "signature": "(filters=None) -> DltLogRecord"}, {"doc": "", "member": "subscribe", "signature": "() -> None"}, {"doc": "A second dlt-receive for a `with` block, e.g. one test; `dlt_filter` like \"APID CTID\".\n`transport`, `host_ip`, `target_ip` and `multicast_ips` aim this recording elsewhere than the\nnode (another interface, another target); its output goes to the `logger_name` logger.", "member": "window", "signature": "(dlt_filter: st // ---- markdown (README) ----
function inline(text, base) {
  return text.split(/(`[^`]*`)/).map((part) => {
    if (part.startsWith("`") && part.endsWith("`") && part.length > 1) return `<code>${esc(part.slice(1, -1))}</code>`;
    return esc(part)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
        const target = /^(https?:|#|\/)/.test(url) ? url : base + url;
        return `<a href="${target}" target="_blank" rel="noopener">${label}</a>`;
      });
  }).join("");
}
function markdown(src, base) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const body = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) body.push(lines[i]);
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`); i++; continue;
    }
    const heading = line.match(/^(#{1,5})\s+(.*)/);
    if (heading) { const level = Math.min(heading[1].length + 2, 6); out.push(`<h${level}>${inline(heading[2], base)}</h${level}>`); i++; continue; }
    if (line.trim().startsWith("|") && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim(), base));
      const header = cells(line); const rows = [];
      for (i += 2; i < lines.length && lines[i].trim().startsWith("|"); i++) rows.push(cells(lines[i]));
      out.push(`<table><tr>${header.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      for (; i < lines.length && /^\s*[-*]\s+/.test(lines[i]); i++) items.push(inline(lines[i].replace(/^\s*[-*]\s+/, ""), base));
      out.push(`<ul>${items.map((t) => `<li>${t}</li>`).join("")}</ul>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    for (; i < lines.length && lines[i].trim() && !/^(#|```|\s*[-*]\s|\s*\|)/.test(lines[i]); i++) para.push(lines[i]);
    if (!para.length) { para.push(line); i++; }
    out.push(`<p>${inline(para.join(" "), base)}</p>`);
  }
  return out.join("");
}

function providerCard(p) {
  return `<a class="card k-prov" href="${href("provider", p.name)}"><div class="head"><div class="icon">P</div><div><h3>${esc(p.name)}</h3><div class="sub mono">${esc(short(p.contract))}</div></div></div>
    <p>${esc(firstLine(p.doc)) || "&nbsp;"}</p><div class="foot"><span class="chip pack">${esc(p.pack)}</span>${variant(p.variant)}</div></a>`;
}
function actionCard(a) {
  return `<a class="card k-prov" href="${href("action", actionId(a))}"><div class="head"><div class="icon">A</div><div><h3>${esc(a.name)}</h3><div class="sub mono">\u2192 ${esc(short(a.state))}</div></div></div>
    <p>${a.requires.length ? `requires ${a.requires.map((r) => esc(short(stateOf(r)))).join(", ")}` : "no prerequisite"}</p>
    <div class="foot"><span class="chip pack">${esc(a.pack)}</span>${variant(a.variant)}</div></a>`;
}
function packCard(p) {
  const providers = DATA.providers.filter((x) => x.pack === p.name), actions = DATA.actions.filter((x) => x.pack === p.name);
  const variants = [...new Set([...providers, ...actions].map((x) => x.variant).filter((v) => v !== "shared"))];
  const title = (p.readme.match(/^#\s+(.*)/m) || [])[1] || p.name;
  return `<a class="card k-pack" href="${href("pack", p.name)}"><div class="head"><div class="icon">\u25a3</div><div><h3>${esc(title)}</h3><div class="sub mono">${esc(p.name)}</div></div></div>
    <p>${esc(firstLine(p.doc))}</p>
    <p>${providers.length} provider${providers.length === 1 ? "" : "s"} \u00b7 ${actions.length} action${actions.length === 1 ? "" : "s"} \u00b7 ${p.entrypoints.length} entrypoint${p.entrypoints.length === 1 ? "" : "s"}</p>
    <div class="foot">${variants.map((v) => `<span class="chip variant">${esc(v)}</span>`).join("")}</div></a>`;
}

const TABS = [
  {id: "capabilities", label: "Capabilities", lead: "Roles a test or another provider can depend on. Pick one to see who provides it, under which name, and who consumes it.",
   items: () => DATA.capabilities.filter((t) => matches(capText(t))), key: category, card: capabilityCard},
  {id: "states", label: "States", lead: "Conditions a recipe can ask for as goals. Each is delivered by an action that declares its prerequisites and effects.",
   items: () => DATA.states.filter((t) => matches(stateText(t))), key: category, card: stateCard},
  {id: "providers", label: "Providers", lead: "Named implementations: what a recipe writes after `using:`.",
   items: () => DATA.providers.filter((p) => matches(provText(p))), key: (p) => p.pack, card: providerCard},
  {id: "actions", label: "Actions", lead: "Named state actions published by packs.",
   items: () => DATA.actions.filter((a) => matches(haystack(a.name, a.state, a.pack, a.doc, a.requires))), key: (a) => a.pack, card: actionCard},
  {id: "packs", label: "Packs", lead: "Installable bundles. Open one to read its documentation and everything it publishes.",
   items: () => DATA.packs.filter((p) => matches(packText(p))), key: (p) => p.name.replace("itf_pack_", ""), card: packCard},
];

function listView(tab) {
  const items = tab.items();
  const shown = items.filter((x) => keep(tab.id, tab.key(x)));
  return `<p class="lead">${esc(tab.lead)}</p>${filters(tab.id, items, tab.key)}
    ${shown.length ? `<div class="grid">${shown.map(tab.card).join("")}</div>` : '<div class="empty">Nothing matches.</div>'}`;
}

// ---- detail views ----
const crumbs = (tab, label) => `<div class="crumbs"><a href="#/${tab}">${esc(TABS.find((t) => t.id === tab).label)}</a> / ${esc(label)}</div>`;

// What a contract means, taken from the first documented provider or action that offers it.
const lead = (docs) => { const d = docs.find(Boolean); return d ? `<p class="sub" style="margin:10px 0 0">${esc(d)}</p>` : ""; };

function capabilityView(t) {
  const providers = providersOf[t] || [], consumers = consumersOf[t] || [];
  const members = [...new Set(providers.flatMap((p) => p.gives))].sort();
  const matrix = providers.length && members.length ? `<table><tr><th>member</th>${providers.map((p) => `<th>${provLink(p)}</th>`).join("")}</tr>${members.map((m) =>
    `<tr><td class="mono">${esc(m)}</td>${providers.map((p) => p.gives.includes(m) ? '<td class="yes">\u2713</td>' : '<td class="no">\u2014</td>').join("")}</tr>`).join("")}</table>` : '<div class="empty">No declared members.</div>';
  return `${crumbs("capabilities", short(t))}
    <div class="hero k-cap"><div class="head"><div class="icon">C</div><div><h2>${esc(short(t))}</h2><div class="sub mono">${esc(t)}</div></div></div>
      <div class="meta"><span class="chip">${providers.length} provider(s)</span><span class="chip">${consumers.length} consumer(s)</span><span class="chip">category: ${esc(category(t))}</span></div>
      ${lead(providers.map((p) => p.doc))}</div>
    <section><h3>Providers \u2014 choose one with <code>using:</code></h3>${providers.map((p) => providerPanel(p) + snippet(providerSnippet(p))).join("") || '<div class="empty">No pack provides this capability yet.</div>'}</section>
    <section><h3>Members each provider offers</h3><div class="panel">${matrix}</div></section>
    <section><h3>Consumed by</h3><div class="panel">${consumers.map(consumerPanel).join("") || '<div class="empty">Only tests consume it.</div>'}</div></section>`;
}

function stateView(t) {
  const deliverers = deliverersOf[t] || [], required = requiredBy[t] || [], invalidated = invalidatedBy[t] || [];
  const relation = (list) => list.map((r) => `<div class="row">${actLink(r.item)} ${packLink(r.item.pack)} ${variant(r.item.variant)}<span class="sub">delivers ${stateLink(r.item.state)}${r.ref.includes(":") ? ` \u00b7 as <span class="mono">${esc(r.ref)}</span>` : ""}</span></div>`).join("");
  return `${crumbs("states", short(t))}
    <div class="hero k-state"><div class="head"><div class="icon">S</div><div><h2>${esc(short(t))}</h2><div class="sub mono">${esc(t)}</div></div></div>
      <div class="meta"><span class="chip">${deliverers.length} action(s)</span><span class="chip">category: ${esc(category(t))}</span></div>
      ${lead(deliverers.map((d) => d.doc))}</div>
    <section><h3>Delivered by \u2014 load one entrypoint; two deliverers in one run conflict</h3>${deliverers.map((a) => actionPanel(a) + snippet(actionSnippet(a))).join("") || '<div class="empty">No pack delivers this state; a recipe may only assume it.</div>'}</section>
    <div class="cols"><section><h3>Required by — these actions run only after it holds</h3><div class="panel">${relation(required) || '<div class="empty">No pack action requires it.</div>'}</div></section>
    <section><h3>Invalidated by — these actions make it false again</h3><div class="panel">${relation(invalidated) || '<div class="empty">No pack action invalidates it.</div>'}</div></section></div>`;
}

function providerView(p) {
  return `${crumbs("providers", p.name)}
    <div class="hero k-prov"><div class="head"><div class="icon">P</div><div><h2>${esc(p.name)}</h2><div class="sub mono">${esc(p.module)}</div></div></div>
      ${p.doc ? `<p>${esc(p.doc)}</p>` : ""}
      <div class="meta">${capLink(p.contract)} ${packLink(p.pack)} ${variant(p.variant)}</div></div>
    <section><h3>Use it</h3>${snippet(providerSnippet(p))}</section>
    <div class="cols"><section><h3>Slots it needs</h3><div class="panel">${slotRows(p.needs)}</div></section>
    <section><h3>Members it offers</h3><div class="panel">${(p.api || []).length ? p.api.map((m) => `<div class="row"><span class="mono"><b>${esc(m.member)}</b>${esc(m.signature)}</span>${m.doc ? `<span class="sub">${esc(m.doc)}</span>` : ""}</div>`).join("") : (p.gives.map((m) => `<span class="chip mono">${esc(m)}</span>`).join(" ") || '<div class="empty">No declared members.</div>')}</div></section></div>
    <section><h3>Configuration</h3><div class="panel">${configTable(p.config)}</div></section>
    <section><h3>Loaded by entrypoints</h3><div class="panel">${p.entrypoints.map((e) => `<div class="row mono">${esc(e)}</div>`).join("")}</div></section>
    <section><h3>Alternatives for ${esc(short(p.contract))}</h3><div class="panel"><div class="row">${(providersOf[p.contract] || []).filter((x) => x !== p).map(provLink).join(" ") || '<span class="empty">None.</span>'}</div></div></section>`;
}

function actionView(a) {
  return `${crumbs("actions", a.name)}
    <div class="hero k-prov"><div class="head"><div class="icon">A</div><div><h2>${esc(a.name)}</h2><div class="sub mono">${esc(a.module)}</div></div></div>
      ${a.doc ? `<p>${esc(a.doc)}</p>` : ""}
      <div class="meta">${stateLink(a.state)} ${packLink(a.pack)} ${variant(a.variant)}</div></div>
    ${actionPanel(a)}
    <section><h3>Use it</h3>${snippet(actionSnippet(a))}</section>
    <section><h3>Slots it uses</h3><div class="panel">${slotRows(a.uses)}</div></section>
    <section><h3>Loaded by entrypoints</h3><div class="panel">${a.entrypoints.map((e) => `<div class="row mono">${esc(e)}</div>`).join("")}</div></section>`;
}

function packView(p) {
  const providers = DATA.providers.filter((x) => x.pack === p.name), actions = DATA.actions.filter((x) => x.pack === p.name);
  const entries = p.entrypoints.map((name) => {
    const e = entryByName[name];
    const published = providers.filter((x) => x.entrypoints.includes(name)), delivered = actions.filter((x) => x.entrypoints.includes(name));
    return `<div class="panel"><h4 class="mono">${esc(name)}</h4>${e.doc ? `<p>${esc(e.doc)}</p>` : ""}
      ${snippet(`pytest_plugins = ["${name}"]`)}
      <div class="row"><b>providers</b>${published.map(provLink).join(" ") || '<span class="empty">none</span>'}</div>
      <div class="row"><b>actions</b>${delivered.map(actLink).join(" ") || '<span class="empty">none</span>'}</div></div>`;
  }).join("");
  return `${crumbs("packs", p.name)}
    <div class="hero k-pack"><div class="head"><div class="icon">\u25a3</div><div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.doc)}</div></div></div>
      <div class="meta">${[...new Set(providers.map((x) => x.contract))].map(capLink).join(" ")} ${[...new Set(actions.map((x) => x.state))].map(stateLink).join(" ")}
      ${p.requirements.map((r) => `<span class="chip warn">${esc(r)}</span>`).join(" ")}</div></div>
    <div class="cols"><section><h3>Documentation</h3><div class="readme">${p.readme ? markdown(p.readme, p.name + "/") : '<p class="empty">No README.</p>'}</div></section>
    <section><h3>Entrypoints \u2014 what each loads</h3>${entries}
      <h3 style="margin-top:18px">Providers</h3>${providers.map(providerPanel).join("") || '<div class="empty">None.</div>'}
      <h3 style="margin-top:18px">Actions</h3>${actions.map((a) => actionPanel(a)).join("") || '<div class="empty">None.</div>'}</section></div>`;
}

// ---- routing ----
function route() {
  const [kind = "capabilities", ...rest] = location.hash.replace(/^#\/?/, "").split("/");
  const id = decodeURIComponent(rest.join("/"));
  const tabFor = {capability: "capabilities", state: "states", provider: "providers", action: "actions", pack: "packs"}[kind] || kind;
  const tab = TABS.find((t) => t.id === tabFor) || TABS[0];
  const counts = {capabilities: DATA.capabilities.length, states: DATA.states.length, providers: DATA.providers.length, actions: DATA.actions.length, packs: DATA.packs.length};
  $("#tabs").innerHTML = TABS.map((t) => `<a href="#/${t.id}" class="${t === tab ? "active" : ""}">${esc(t.label)}<span class="n">${query ? t.items().length : counts[t.id]}</span></a>`).join("");
  const banner = DATA.errors.length ? `<div class="banner">Skipped entrypoints that failed to import: ${DATA.errors.map((e) => `<code>${esc(e.entrypoint)}</code> (${esc(e.error)})`).join(", ")}</div>` : "";
  const detail = {
    capability: () => DATA.capabilities.includes(id) && capabilityView(id),
    state: () => DATA.states.includes(id) && stateView(id),
    provider: () => providerByName[id] && providerView(providerByName[id]),
    action: () => actionById[id] && actionView(actionById[id]),
    pack: () => packByName[id] && packView(packByName[id]),
  }[kind];
  $("#view").innerHTML = banner + ((detail && detail()) || listView(tab));
  document.title = `${id ? short(id) + " \u2014 " : ""}ITF Pack Catalog`;
}

$("#stats").textContent = `${DATA.packs.length} packs \u00b7 ${DATA.capabilities.length} capabilities \u00b7 ${DATA.states.length} states \u00b7 ${DATA.providers.length} providers \u00b7 ${DATA.actions.length} actions`;
$("#q").addEventListener("input", (e) => {
  query = e.target.value.trim();
  const [kind] = location.hash.replace(/^#\/?/, "").split("/");
  const current = TABS.find((t) => t.id === kind);
  if (!current || (query && !current.items().length)) {
    const firstHit = TABS.find((t) => t.items().length) || current || TABS[0];
    if (`#/${firstHit.id}` !== location.hash) { location.hash = `#/${firstHit.id}`; return; }
  }
  route();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
document.addEventListener("click", (e) => {
  const filter = e.target.closest("[data-filter]");
  if (filter) { activeFilter[filter.dataset.filter] = filter.dataset.key; route(); }
  const copy = e.target.closest("[data-copy]");
  if (copy) { navigator.clipboard?.writeText(copy.dataset.copy); copy.textContent = "copied"; setTimeout(() => (copy.textContent = "copy"), 1200); }
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
route();
</script>
</body>
</html>
