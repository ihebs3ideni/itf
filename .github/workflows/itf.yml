on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
jobs:
  itf-build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
      - name: Run build
        run: |
          bazel build //...
      - name: Validate compositions
        # An itf_target compiles its composition in a build action (both gates, strict shapes, the contract
        # definitions) and constructs nothing, so a wrong composition fails here, before any container starts.
        # `itf validate` is the same check from the command line.
        run: |
          bazel build $(bazel query 'kind(_itf_target, //...) except attr(tags, manual, //...)')
      - name: Check the contract policy
        run: |
          bazel run //score/itf/cli:itf -- contracts check --policy tools/contracts_policy.yaml
      - name: Run test
        # The conformance suites (one test per node and contract check) run with everything else.
        run: |
          bazel test //... \
            //test/integration:conformance_local \
            //test/integration:conformance_serial \
            //test/integration:conformance_docker \
            //test/integration:conformance_docker_ssh

  itf-qemu-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-x86 cloud-image-utils
      - name: Enable KVM group perms
        run: |
          sudo chmod 666 /dev/kvm
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Linux QEMU integration tests
        run: |
          bazel test //test/integration:linux_qemu_tests --config=qemu-integration-linux
